<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Unificado - Solicitações e Gestão</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            background: #f1f5f9; 
            color: #1e293b; 
            padding: 20px;
        }
        .main-container { 
            max-width: 1100px; 
            margin: 0 auto; 
        }
        header {
            text-align: center;
            margin-bottom: 25px;
        }
        header h1 {
            color: #0f172a;
            margin: 0 0 5px 0;
            font-size: 24px;
        }
        header p {
            color: #64748b;
            font-size: 14px;
            margin: 0;
        }
        .grid-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media(min-width: 768px) {
            .grid-layout {
                grid-template-columns: 1fr 1fr;
            }
        }
        .card { 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            margin-bottom: 20px;
        }
        .card h3 {
            margin-top: 0;
            color: #0f172a;
            font-size: 18px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .menu-grid { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .btn-modulo { 
            padding: 14px 18px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 14px; 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            text-decoration: none; 
            transition: background 0.2s, transform 0.1s; 
        }
        .btn-modulo:hover { transform: translateY(-1px); }
        .btn-epi { background: #2563eb; }
        .btn-epi:hover { background: #1d4ed8; }
        .btn-ferramenta { background: #0d9488; }
        .btn-ferramenta:hover { background: #0f766e; }
        .btn-login-gestor { background: #475569; }
        .btn-login-gestor:hover { background: #334155; }

        /* Abas de navegação do Gestor */
        .abas-container { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .btn-aba { padding: 10px 15px; background: #cbd5e1; color: #1e293b; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-aba.ativo { background: #2563eb; color: white; }

        /* Estilos gerais para tabelas e botões */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { border: 1px solid #cbd5e1; padding: 10px; text-align: left; vertical-align: top; }
        th { background: #f8fafc; color: #475569; }
        button { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 12px; background: #2563eb; color: white; margin-right: 3px; }
        button:hover { background: #1d4ed8; }
        .btn-aprovar { background: #16a34a; }
        .btn-aprovar:hover { background: #15803d; }
        .btn-concluir { background: #0284c7; }
        .btn-concluir:hover { background: #0369a1; }
        .btn-imprimir { background: #475569; }
        .btn-imprimir:hover { background: #334155; }
        .btn-excluir { background: #ef4444; }
        .btn-excluir:hover { background: #dc2626; }
        .item-lista { border-bottom: 1px dashed #cbd5e1; padding-bottom: 8px; margin-bottom: 8px; }
        .item-lista:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        img.epi-foto { width: 70px; height: 70px; object-fit: cover; border-radius: 4px; border: 1px solid #cbd5e1; cursor: pointer; transition: transform 0.2s; }
        img.epi-foto:hover { transform: scale(2.5); }
        
        .status-badge { display: inline-flex; align-items: center; gap: 6px; font-weight: bold; font-size: 12px; padding: 4px 8px; border-radius: 12px; }
        .bolinha { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .status-pendente { background: #fef3c7; color: #b45309; border: 1px solid #f59e0b; }
        .status-pendente .bolinha { background: #f59e0b; }
        .status-aprovado { background: #e0f2fe; color: #0369a1; border: 1px solid #38bdf8; }
        .status-aprovado .bolinha { background: #0284c7; }

        .oculto { display: none !important; }
        
        .login-box {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #475569;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form
