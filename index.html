<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Solicitações - Menu Principal</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            background: #f1f5f9; 
            color: #1e293b; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        .container { 
            width: 100%; 
            max-width: 500px; 
            padding: 20px; 
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            text-align: center; 
        }
        h2 { 
            color: #0f172a; 
            margin-top: 0; 
            margin-bottom: 8px; 
        }
        p.subtitulo { 
            color: #64748b; 
            font-size: 14px; 
            margin-bottom: 25px; 
        }
        .menu-grid { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .btn-modulo { 
            padding: 16px 20px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 15px; 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            text-decoration: none; 
            transition: background 0.2s, transform 0.1s; 
        }
        .btn-modulo:hover { 
            transform: translateY(-2px); 
        }
        .btn-epi { 
            background: #2563eb; 
        }
        .btn-epi:hover { 
            background: #1d4ed8; 
        }
        .btn-ferramenta { 
            background: #0d9488; 
        }
        .btn-ferramenta:hover { 
            background: #0f766e; 
        }
        .divider {
            margin: 20px 0;
            border: none;
            border-top: 1px solid #e2e8f0;
        }
        .btn-gestor {
            background: #475569;
        }
        .btn-gestor:hover {
            background: #334155;
        }
        .footer-info { 
            margin-top: 20px; 
            font-size: 12px; 
            color: #94a3b8; 
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h2>Portal de Solicitações</h2>
            <p class="subtitulo">Selecione o módulo desejado ou acesse a administração:</p>

            <div class="menu-grid">
                <a href="solicitacao.html" class="btn-modulo btn-epi">
                    🦺 Solicitação de EPIs
                </a>

                <a href="ferramentas.html" class="btn-modulo btn-ferramenta">
                    🛠️ Solicitação de Ferramentas
                </a>

                <hr class="divider">
