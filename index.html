<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão e Solicitações</title>
    <!-- LINK OBRIGATÓRIO PARA O PWABUILDER RECONHECER O PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f1f5f9; color: #1e293b; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #0f172a; margin-top: 0; }
        button { display: block; width: 100%; padding: 12px; margin-top: 15px; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; background: #2563eb; color: white; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        .btn-gestor { background: #0f172a; }
        .btn-gestor:hover { background: #1e293b; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Menu Principal</h2>
        <p style="color: #64748b; font-size: 13px;">Selecione o painel desejado:</p>
        
        <button class="btn-gestor" onclick="location.href='gestor.html'">Painel do Gestor (Central)</button>
        <button onclick="location.href='solicitacao_ferramentas.html'">Solicitação de Ferramentas</button>
