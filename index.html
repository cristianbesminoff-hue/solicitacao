<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de EPIs - Seleção de Acesso</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #0f172a; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .menu-card { background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; width: 100%; max-width: 400px; }
        h2 { margin-bottom: 10px; color: #f8fafc; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
        .btn-opcao { display: block; width: 100%; padding: 15px; margin-bottom: 15px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; transition: background 0.2s; box-sizing: border-box; text-align: center; }
        .btn-tecnico { background: #2563eb; color: white; }
        .btn-tecnico:hover { background: #1d4ed8; }
        .btn-gestor { background: #334155; color: white; border: 1px solid #475569; }
        .btn-gestor:hover { background: #475569; }
    </style>
</head>
<body>

    <div class="menu-card">
        <h2>Controle de EPIs</h2>
        <p>Selecione o seu perfil de acesso para continuar:</p>

        <!-- Direciona para a página de solicitação/login do técnico -->
        <a href="solicitacao.html" class="btn-opcao btn-tecnico">Sou Técnico / Colaborador</a>
        
        <!-- Direciona para o painel do gestor -->
        <a href="gestor.html" class="btn-opcao btn-gestor">Sou Gestor</a>
    </div>

</body>
