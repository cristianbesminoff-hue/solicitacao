<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Solicitações - Menu Inicial</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            background: #f1f5f9; 
            color: #1e293b; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        .container { 
            width: 100%; 
            max-width: 500px; 
            padding: 20px; 
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            text-align: center; 
        }
        h2 { 
            color: #0f172a; 
            margin-top: 0; 
            margin-bottom: 8px; 
        }
        p.subtitulo { 
            color: #64748b; 
            font-size: 14px; 
            margin-bottom: 30px; 
        }
        .menu-grid { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        .btn-modulo { 
            padding: 18px 20px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px; 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px; 
            text-decoration: none; 
            transition: background 0.2s, transform 0.1s; 
        }
        .btn-modulo:hover { 
            transform: translateY(-2px); 
        }
        .btn-epi { 
            background: #2563eb; 
        }
        .btn-epi:hover { 
            background: #1d4ed8; 
        }
        .btn-ferramenta { 
            background: #0d9488; 
        }
        .btn-ferramenta:hover { 
            background: #0f766e; 
        }
        .footer-info { 
            margin-top: 25px; 
            font-size: 12px; 
            color: #94a3b8; 
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h2>Selecione o Módulo</h2>
            <p class="subtitulo">Escolha abaixo qual tipo de solicitação deseja realizar:</p>

            <div class="menu-grid">
                <!-- Botão para o Painel de EPIs -->
                <a href="solicitacao.html" class="btn-modulo btn-epi">
                    🦺 Solicitação de EPIs
                </a>

                <!-- Botão para o Painel de Ferramentas (substitua 'ferramentas.html' pelo nome exato da sua página de ferramentas se for diferente) -->
                <a href="ferramentas.html" class="btn-modulo btn-ferramenta">
                    🛠️ Solicitação de Ferramentas
                </a>
            </div>

            <div class="footer-info">
                Sistema Integrado de Gestão de Campo
            </div>
        </div>
    </div>

</body>
</html>
