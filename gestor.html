<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unifique - Painel do Gestor</title>
    <!-- Firebase SDKs Tradicionais Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 600px; text-align: center; }
        h2 { color: #1e293b; margin-top: 0; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: bold; color: #333; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { background: #d97706; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 10px; }
        button:hover { background: #b45309; }
        .btn-success { background: #16a34a; padding: 6px 12px; font-size: 12px; width: auto; }
        .btn-danger { background: #dc2626; padding: 6px 12px; font-size: 12px; width: auto; }
        .hidden { display: none !important; }
        .back-link { display: inline-block; margin-top: 15px; color: #2563eb; text-decoration: none; font-size: 14px; cursor: pointer; }
        .list-item { background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 6px; margin-bottom: 10px; text-align: left; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <div id="view-gestor-login">
            <h2>Acesso Gestor</h2>
            <div class="form-group">
                <label>Senha de Administrador</label>
                <input type="password" id="manager-pass" placeholder="Digite a senha (admin123)">
            </div>
            <button onclick="logarGestor()">Entrar no Painel</button>
            <a class="back-link" onclick="window.location.href='index.html'">← Voltar ao início</a>
        </div>

        <div id="view-gestor-panel" class="hidden">
            <h2>Cadastros Pendentes</h2>
            <div id="list-pendentes" style="margin-bottom: 20px;">Carregando...</div>
            <button style="background: #64748b;" onclick="window.location.href='index.html'">Sair</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD1eeSRBVV4LDzRFLLcKEkQb3We9AtgMzA",
            authDomain: "solicitacoes-80f5d.firebaseapp.com",
            projectId: "solicitacoes-80f5d",
            storageBucket: "solicitacoes-80f5d.firebasestorage.app",
            messagingSenderId: "477445719389",
            appId: "1:477445719389:web:7b18d78a8d66e9e11614b4"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function logarGestor() {
            const senha = document.getElementById('manager-pass').value;
            if (senha === 'admin123') {
                document.getElementById('view-gestor-login').classList.add('hidden');
                document.getElementById('view-gestor-panel').classList.remove('hidden');
                carregarPendentes();
            } else {
                alert('Senha incorreta! Use admin123');
            }
        }

        async function carregarPendentes() {
            const container = document.getElementById('list-pendentes');
            container.innerHTML = 'Carregando...';
            try {
                const snapshot = await db.collection('usuarios').where('status', '==', 'pendente').get();
                if (snapshot.empty) {
                    container.innerHTML = '<p>Nenhum cadastro pendente no momento.</p>';
                    return;
                }
                let html = '';
                snapshot.forEach(doc => {
                    const u = doc.data();
                    const id = doc.id;
                    html += `
                        <div class="list-item">
                            <div><b>${u.nome}</b><br><small>${u.email}</small></div>
                            <div>
                                <button class="btn-success" onclick="aprovar('${id}')">Aprovar</button>
                                <button class="btn-danger" onclick="negar('${id}')">Excluir</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = 'Erro ao carregar dados.';
            }
        }

        async function aprovar(id) {
            await db.collection('usuarios').doc(id).update({ status: 'aprovado' });
            alert('Usuário aprovado!');
            carregarPendentes();
        }

        async function negar(id) {
            if (confirm('Deseja excluir este cadastro?')) {
                await db.collection('usuarios').doc(id).delete();
                alert('Cadastro removido.');
                carregarPendentes();
            }
        }
    </script>
</body>
</html>
