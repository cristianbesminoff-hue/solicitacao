<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Técnico - Solicitação de EPIs e Ferramentas</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f7f6; color: #333; }
        header { background: #d97706; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2, h3 { color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
        label { font-weight: bold; display: block; margin-top: 10px; font-size: 14px; }
        select, input, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
        button { background: #d97706; color: white; border: none; padding: 12px; font-weight: bold; cursor: pointer; border-radius: 4px; width: 100%; margin-top: 15px; }
        button:hover { background: #b45309; }
        button.sair { background: #dc2626; width: auto; padding: 8px 15px; font-size: 14px; margin: 0; }
        .aba-container { display: flex; margin-bottom: 15px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
        .aba-btn { flex: 1; padding: 12px; text-align: center; cursor: pointer; font-weight: bold; background: #e2e8f0; border: none; }
        .aba-btn.ativo { background: #d97706; color: white; }
        .formulario-secao { display: none; }
        .formulario-secao.ativo { display: block; }
        .bloco-item { background: #f8fafc; border: 1px dashed #cbd5e1; padding: 12px; border-radius: 6px; margin-top: 10px; position: relative; }
        .btn-remover-item { background: #dc2626; width: auto; padding: 5px 10px; font-size: 12px; margin-top: 5px; float: right; }
        .btn-adicionar-mais { background: #2563eb; margin-top: 10px; }
        .btn-adicionar-mais:hover { background: #1d4ed8; }
        .minhas-solicitacoes { background: #f8fafc; border-left: 4px solid #d97706; padding: 12px; margin-top: 10px; border-radius: 4px; font-size: 13px; }
        .bolinha { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .bolinha-laranja { background: #d97706; }
        .bolinha-verde { background: #16a34a; }
        .bolinha-vermelha { background: #dc2626; }
    </style>
</head>
<body>

    <header>
        <div>
            <span id="saudacao-usuario" style="font-weight: bold;">Carregando...</span>
        </div>
        <button class="sair" onclick="sairTecnico()">Sair</button>
    </header>

    <div class="container">
        <!-- ABAS DE NAVEGAÇÃO -->
        <div class="aba-container">
            <button class="aba-btn ativo" onclick="mudarAba('epi')">Solicitar EPI</button>
            <button class="aba-btn" onclick="mudarAba('ferramenta')">Solicitar Ferramenta</button>
        </div>

        <!-- FORMULÁRIO DE EPI -->
        <div id="secao-epi" class="card formulario-secao ativo">
            <h3>Nova Solicitação de EPI</h3>
            <form id="form-epi" onsubmit="enviarSolicitacao(event, 'EPI')">
                <div id="container-itens-epi">
                    <div class="bloco-item">
                        <label>Selecione o EPI:</label>
                        <select class="input-item" required>
                            <option value="">Selecione...</option>
                            <option value="Botina de Segurança">Botina de Segurança</option>
                            <option value="Óculos de Proteção">Óculos de Proteção</option>
                            <option value="Capacete com Jugular">Capacete com Jugular</option>
                            <option value="Luva de Raspa / Pigmentada">Luva de Raspa / Pigmentada</option>
                            <option value="Cinto Paraquedista (NR35)">Cinto Paraquedista (NR35)</option>
                            <option value="Talabarte de Posicionamento">Talabarte de Posicionamento</option>
                        </select>
                    </div>
                </div>
                <button type="button" class="btn-adicionar-mais" onclick="adicionarCampoItem('epi')">+ Incluir mais um EPI</button>

                <label>Observação Geral / Tamanho:</label>
                <textarea id="obs-epi" placeholder="Ex: Tamanho da bota 42, motivo da troca..."></textarea>
                
                <button type="submit">Enviar Solicitação de EPI</button>
            </form>
        </div>

        <!-- FORMULÁRIO DE FERRAMENTA -->
        <div id="secao-ferramenta" class="card formulario-secao">
            <h3>Nova Solicitação de Ferramenta</h3>
            <form id="form-ferramenta" onsubmit="enviarSolicitacao(event, 'Ferramenta')">
                <div id="container-itens-ferramenta">
                    <div class="bloco-item">
                        <label>Selecione a Ferramenta:</label>
                        <select class="input-item" required>
                            <option value="">Selecione...</option>
                            <option value="Furadeira / Parafusadeira">Furadeira / Parafusadeira</option>
                            <option value="Clivador de Fibra Óptica">Clivador de Fibra Óptica</option>
                            <option value="Power Meter / Optical Power Meter">Power Meter / Optical Power Meter</option>
                            <option value="Caneta Óptica (Localizador Visual)">Caneta Óptica (Localizador Visual)</option>
                            <option value="Alicate de Crimpagem RJ45">Alicate de Crimpagem RJ45</option>
                            <option value="Jogo de Chaves de Fenda / Philips">Jogo de Chaves de Fenda / Philips</option>
                        </select>
                    </div>
                </div>
                <button type="button" class="btn-adicionar-mais" onclick="adicionarCampoItem('ferramenta')">+ Incluir mais uma Ferramenta</button>

                <label>Observação Geral:</label>
                <textarea id="obs-ferramenta" placeholder="Motivo da solicitação da ferramenta..."></textarea>
                
                <button type="submit">Enviar Solicitação de Ferramenta</button>
            </form>
        </div>

        <!-- MEUS PEDIDOS -->
        <div class="card">
            <h3>Minhas Solicitações</h3>
            <div id="lista-minhas-solicitacoes">Carregando seus pedidos...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addContent, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5bbJ5g8jtWjI0-13dWFifgZxc3SK0-g",
            authDomain: "fiscalizar-ef7de.firebaseapp.com",
            projectId: "fiscalizar-ef7de",
            storageBucket: "fiscalizar-ef7de.firebasestorage.app",
            messagingSenderId: "392888202041",
            appId: "1:477445719389:web:7b18d78a8d66e9e11614b4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado'));

        if (!usuarioLogado) {
            alert("Faça login para continuar!");
            window.location.href = "index.html";
        }

        document.getElementById('saudacao-usuario').textContent = `Técnico: ${usuarioLogado.nome}`;

        window.sairTecnico = function() {
            localStorage.removeItem('usuarioLogado');
            window.location.href = "index.html";
        }

        window.mudarAba = function(tipo) {
            document.querySelectorAll('.aba-btn').forEach(b => b.classList.remove('ativo'));
            document.querySelectorAll('.formulario-secao').forEach(s => s.classList.remove('ativo'));

            if (tipo === 'epi') {
                document.querySelectorAll('.aba-btn')[0].classList.add('ativo');
                document.getElementById('secao-epi').classList.add('ativo');
            } else {
                document.querySelectorAll('.aba-btn')[1].classList.add('ativo');
                document.getElementById('secao-ferramenta').classList.add('ativo');
            }
        }

        window.adicionarCampoItem = function(tipo) {
            const containerId = tipo === 'epi' ? 'container-itens-epi' : 'container-itens-ferramenta';
            const container = document.getElementById(containerId);
            
            let optionsHtml = tipo === 'epi' ? `
                <option value="">Selecione...</option>
                <option value="Botina de Segurança">Botina de Segurança</option>
                <option value="Óculos de Proteção">Óculos de Proteção</option>
                <option value="Capacete com Jugular">Capacete com Jugular</option>
                <option value="Luva de Raspa / Pigmentada">Luva de Raspa / Pigmentada</option>
                <option value="Cinto Paraquedista (NR35)">Cinto Paraquedista (NR35)</option>
                <option value="Talabarte de Posicionamento">Talabarte de Posicionamento</option>
            ` : `
                <option value="">Selecione...</option>
                <option value="Furadeira / Parafusadeira">Furadeira / Parafusadeira</option>
                <option value="Clivador de Fibra Óptica">Clivador de Fibra Óptica</option>
                <option value="Power Meter / Optical Power Meter">Power Meter / Optical Power Meter</option>
                <option value="Caneta Óptica (Localizador Visual)">Caneta Óptica (Localizador Visual)</option>
                <option value="Alicate de Crimpagem RJ45">Alicate de Crimpagem RJ45</option>
                <option value="Jogo de Chaves de Fenda / Philips">Jogo de Chaves de Fenda / Philips</option>
            `;

            const novoBloco = document.createElement('div');
            novoBloco.className = 'bloco-item';
            novoBloco.innerHTML = `
                <button type="button" class="btn-remover-item" onclick="this.parentElement.remove()">Remover</button>
                <label>Selecione o item:</label>
                <select class="input-item" required>
                    ${optionsHtml}
                </select>
            `;
            container.appendChild(novoBloco);
        }

        window.enviarSolicitacao = async function(event, tipo) {
            event.preventDefault();
            
            const containerId = tipo === 'EPI' ? 'container-itens-epi' : 'container-itens-ferramenta';
            const selects = document.querySelectorAll(`#${containerId} .input-item`);
            const obsId = tipo === 'EPI' ? 'obs-epi' : 'obs-ferramenta';
            const observacao = document.getElementById(obsId).value;

            let itensSelecionados = [];
            selects.forEach(sel => {
                if(sel.value) itensSelecionados.push(sel.value);
            });

            if (itensSelecionados.length === 0) {
                alert("Selecione ao menos um item.");
                return;
            }

            const agora = new Date();
            const dataEnvioStr = agora.toLocaleDateString() + ' ' + agora.toLocaleTimeString();

            try {
                // Envia cada item selecionado como um registro ou agrupado (salvando como string combinada ou itens separados)
                // Aqui salvamos o item concatenado ou listado para o gestor visualizar perfeitamente
                const itemFinal = itensSelecionados.join(', ');

                await addDoc(collection(db, "solicitacoes_epis"), {
                    usuarioEmail: usuarioLogado.email,
                    nomeTecnico: usuarioLogado.nome,
                    tipo: tipo,
                    item: itemFinal,
                    observacao: observacao,
                    statusPedido: 'PENDENTE',
                    timestamp: agora.getTime(),
                    dataEnvio: dataEnvioStr
                });

                alert("Solicitação enviada com sucesso!");
                document.getElementById(tipo === 'EPI' ? 'form-epi' : 'form-ferramenta').reset();
                
                // Restaura apenas 1 campo padrão de item
                document.getElementById(containerId).innerHTML = `
                    <div class="bloco-item">
                        <label>Selecione o ${tipo}:</label>
                        <select class="input-item" required>
                            <option value="">Selecione...</option>
                            ${tipo === 'EPI' ? `
                                <option value="Botina de Segurança">Botina de Segurança</option>
                                <option value="Óculos de Proteção">Óculos de Proteção</option>
                                <option value="Capacete com Jugular">Capacete com Jugular</option>
                                <option value="Luva de Raspa / Pigmentada">Luva de Raspa / Pigmentada</option>
                                <option value="Cinto Paraquedista (NR35)">Cinto Paraquedista (NR35)</option>
                                <option value="Talabarte de Posicionamento">Talabarte de Posicionamento</option>
                            ` : `
                                <option value="Furadeira / Parafusadeira">Furadeira / Parafusadeira</option>
                                <option value="Clivador de Fibra Óptica">Clivador de Fibra Óptica</option>
                                <option value="Power Meter / Optical Power Meter">Power Meter / Optical Power Meter</option>
                                <option value="Caneta Óptica (Localizador Visual)">Caneta Óptica (Localizador Visual)</option>
                                <option value="Alicate de Crimpagem RJ45">Alicate de Crimpagem RJ45</option>
                                <option value="Jogo de Chaves de Fenda / Philips">Jogo de Chaves de Fenda / Philips</option>
                            `}
                        </select>
                    </div>
                `;

                carregarMinhasSolicitacoes();
            } catch (e) {
                console.error(e);
                alert("Erro ao enviar solicitação.");
            }
        }

        async function carregarMinhasSolicitacoes() {
            const divLista = document.getElementById('lista-minhas-solicitacoes');
            divLista.innerHTML = "Carregando...";

            try {
                const q = query(collection(db, "solicitacoes_epis"), where("usuarioEmail", "==", usuarioLogado.email));
                const querySnapshot = await getDocs(q);
                let lista = [];
                querySnapshot.forEach(d => {
                    lista.push({ id: d.id, ...d.data() });
                });

                lista.sort((a,b) => b.timestamp - a.timestamp);

                divLista.innerHTML = lista.length === 0 ? '<p>Nenhuma solicitação encontrada.</p>' : '';
                lista.forEach(p => {
                    let classeBolinha = 'bolinha-laranja';
                    let status = p.statusPedido || 'PENDENTE';

                    if (status === 'APROVADO') classeBolinha = 'bolinha-verde';
                    if (status === 'ENTREGUE / FECHADO' || status === 'REJEITADO') classeBolinha = 'bolinha-vermelha';

                    divLista.innerHTML += `
                        <div class="minhas-solicitacoes">
                            <b>Categoria:</b> ${p.tipo} | <b>Item(ns):</b> ${p.item} <br>
                            <b>Observação:</b> ${p.observacao || 'Nenhuma'} <br>
                            <b>Status:</b> <span class="bolinha ${classeBolinha}"></span><b>${status}</b> <br>
                            <b>Enviado em:</b> ${p.dataEnvio}
                            ${p.dataConclusao ? `<br><b>Concluído em:</b> ${p.dataConclusao}` : ''}
                        </div>
                    `;
                });
            } catch (e) {
                console.error(e);
                divLista.innerHTML = "<p>Erro ao carregar histórico.</p>";
            }
        }

        carregarMinhasSolicitacoes();
    </script>
</body>
</html>
