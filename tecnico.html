<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Técnico - Solicitações</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f4f7f6; color: #333; }
        header { background: #2563eb; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .container { padding: 15px; max-width: 800px; margin: auto; }
        .card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2, h3 { color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px; }
        input, select, textarea, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        button { background: #2563eb; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        button.sair { background: #dc2626; width: auto; padding: 8px 15px; font-size: 14px; margin: 0; }
        .btn-voltar { background: #64748b; margin-bottom: 10px; width: auto; }
        .btn-voltar:hover { background: #475569; }
        .menu-escolha { display: flex; gap: 15px; margin-top: 15px; }
        .btn-escolha { padding: 25px; font-size: 16px; background: #0284c7; flex: 1; text-align: center; border-radius: 8px; cursor: pointer; }
        .btn-escolha:hover { background: #0369a1; }
        .btn-ferramenta { background: #0d9488; }
        .btn-ferramenta:hover { background: #0f766e; }
        .hidden { display: none; }
        .lista-pedido { background: #f8fafc; border-left: 4px solid #2563eb; padding: 12px; margin-top: 10px; border-radius: 4px; font-size: 13px; }
        .status-pendente { color: #d97706; font-weight: bold; }
        .status-aprovado { color: #16a34a; font-weight: bold; }
        .status-rejeitado { color: #dc2626; font-weight: bold; }
        .status-entregue { color: #2563eb; font-weight: bold; }
        
        /* Container para alinhar múltiplas miniaturas de fotos */
        .preview-container { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .preview-img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; border: 1px solid #cbd5e1; }
        
        .bloco-item-dinamico { background: #f8fafc; border: 1px dashed #cbd5e1; padding: 12px; border-radius: 6px; margin-top: 10px; position: relative; }
        .btn-remover-item { background: #dc2626; width: auto; padding: 6px 12px; font-size: 12px; margin-top: 5px; float: right; }
        .btn-adicionar-mais { background: #2563eb; margin-top: 5px; }
        .btn-adicionar-mais:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <header>
        <div>
            <span style="font-weight: bold;" id="saudacao-tecnico">Painel do Técnico</span>
        </div>
        <button class="sair" onclick="sairTecnico()">Sair</button>
    </header>

    <div class="container">
        <!-- TELA 1: ESCOLHA ENTRE EPI OU FERRAMENTA -->
        <div id="tela-escolha" class="card">
            <h3>O que você deseja solicitar?</h3>
            <p>Selecione a categoria do item necessário para o seu trabalho de campo:</p>
            <div class="menu-escolha">
                <button class="btn-escolha" onclick="abrirFormulario('EPI')">🪖 Solicitar EPI</button>
                <button class="btn-escolha btn-ferramenta" onclick="abrirFormulario('Ferramenta')">🛠️ Solicitar Ferramenta</button>
            </div>
        </div>

        <!-- TELA 2: FORMULÁRIO DE SOLICITAÇÃO (DINÂMICO) -->
        <div id="tela-formulario" class="card hidden">
            <button class="btn-voltar" onclick="voltarEscolha()">⬅ Voltar e trocar categoria</button>
            <h3 id="titulo-formulario">Nova Solicitação</h3>
            <div id="msg-aviso" style="color: #dc2626; font-size: 13px; margin-bottom: 10px;"></div>
            
            <div id="container-itens">
                <!-- Os itens dinâmicos são injetados aqui -->
            </div>

            <button type="button" class="btn-adicionar-mais" onclick="adicionarNovoItemLinha()">+ Incluir mais um item</button>

            <label style="margin-top: 15px;">Observação / Justificativa:</label>
            <textarea id="obs-item" placeholder="Desgaste, quebra, extravio, novo colaborador..."></textarea>

            <label>Fotos do Item / Comprovante (Opcional - selecione uma ou várias):</label>
            <!-- Adicionado o atributo 'multiple' para aceitar vários arquivos de uma vez -->
            <input type="file" id="foto-item" accept="image/*" multiple onchange="processarFotos(this)">
            <div id="status-foto" style="font-size: 12px; color: #16a34a; font-weight: bold; margin-top: 2px;"></div>
            <div id="preview-container" class="preview-container"></div>

            <button onclick="enviarSolicitacao()" style="background: #16a34a; margin-top: 15px;">Enviar Solicitação</button>
        </div>

        <!-- HISTÓRICO DE PEDIDOS DO TÉCNICO -->
        <div class="card">
            <h3>Meus Pedidos Realizados</h3>
            <div id="meus-pedidos">Carregando seus pedidos...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5bbJ5g8jtWjI0-13dWFifgZxc3SK0-g",
            authDomain: "fiscalizar-ef7de.firebaseapp.com",
            projectId: "fiscalizar-ef7de",
            storageBucket: "fiscalizar-ef7de.firebasestorage.app",
            messagingSenderId: "392888202041",
            appId: "1:477445719389:web:7b18d78a8d66e9e11614b4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado'));

        if (!usuarioLogado || usuarioLogado.perfil === 'gestor') {
            alert("Acesso restrito a técnicos!");
            window.location.href = "index.html";
        }

        document.getElementById('saudacao-tecnico').textContent = `Técnico: ${usuarioLogado.nome}`;

        window.sairTecnico = function() {
            localStorage.removeItem('usuarioLogado');
            window.location.href = "index.html";
        }

        const listaEpis = [
            "Óculos Escuros", "Óculos Transparente", "Capacete", "Cinto Paraquedista",
            "Talabarte de Posicionamento", "Luva Isolante", "Luva de Cobertura",
            "Luva de Vaqueta", "Detector de Tensão", "Eureka", "Corda Linha de Vida",
            "Fita Catraca", "Fita de Ancoragem 1,20", "Fita de Ancoragem 0,80",
            "Calça Antichama", "Jaleco Antichama", "Camisa", "Botina numero de 35 ao 43",
            "Escada", "Cones", "Outro EPI (digitação)"
        ];

        const listaFerramentas = [
            "Alicate de Corte", "Alicate Universal", "Alicate de Bico", "Chave BAP",
            "Chave de Guarita", "Chave Philips P", "Chave Philips M", "Chave Philips G",
            "Chave de Fenda P", "Chave de Fenda M", "Chave de Fenda G", "Alicate Decapador",
            "Alicate Striper", "Power Meter", "Clivador", "Clivador de Fusão",
            "Caneta de Limpeza", "Frasco de Álcool", "Caneta Laser", "Máquina de Fusão",
            "Bancada Naval", "Morsa", "Martelo Unha", "Furadeira", "Decapador",
            "Alicate Crimpador", "Notebook", "Fusimec (Máquina de Cintar)",
            "Guia Passa Fio", "OTDR", "Identificador de Fibra Ativa", "Arco de Serra",
            "Lanterna LED", "Maçarico", "Rotulador Tubo Loose", "Decapador Longitudinal Tubo Loose",
            "Estilete", "Cavalete de Fibra", "Balde de Lona", "Etiquetadora",
            "Gabarito", "Outra Ferramenta (digitação)"
        ];

        let categoriaAtual = "";
        let fotosBase64Array = []; // Array para armazenar múltiplas fotos compactadas

        window.abrirFormulario = function(tipo) {
            categoriaAtual = tipo;
            document.getElementById('tela-escolha').classList.add('hidden');
            document.getElementById('tela-formulario').classList.remove('hidden');
            
            const titulo = document.getElementById('titulo-formulario');
            titulo.textContent = tipo === 'EPI' ? "Solicitação de EPI" : "Solicitação de Ferramenta";
            
            document.getElementById('container-itens').innerHTML = "";
            adicionarNovoItemLinha();
        }

        window.adicionarNovoItemLinha = function() {
            const container = document.getElementById('container-itens');
            let opcoesHtml = "";
            
            const lista = categoriaAtual === 'EPI' ? listaEpis : listaFerramentas;
            lista.forEach(item => {
                opcoesHtml += `<option value="${item}">${item}</option>`;
            });

            const indexBloco = Date.now() + Math.random();

            const bloco = document.createElement('div');
            bloco.className = 'bloco-item-dinamico';
            bloco.id = `bloco_${indexBloco}`;
            
            let botaoRemoverHtml = container.children.length > 0 ? `<button type="button" class="btn-remover-item" onclick="removerBlocoItem('${bloco.id}')">Remover</button>` : '';

            bloco.innerHTML = `
                ${botaoRemoverHtml}
                <label>Selecione o Item:</label>
                <select class="select-item" onchange="verificarOutroItemDinamico(this)">
                    ${opcoesHtml}
                </select>
                <div class="bloco-outro hidden" style="margin-top: 8px;">
                    <label>Digite o nome do item:</label>
                    <input type="text" class="input-outro-item" placeholder="Especifique o nome do item...">
                </div>
            `;
            container.appendChild(bloco);
        }

        window.removerBlocoItem = function(idBloco) {
            const bloco = document.getElementById(idBloco);
            if (bloco) bloco.remove();
        }

        window.verificarOutroItemDinamico = function(selectElement) {
            const blocoOutro = selectElement.parentElement.querySelector('.bloco-outro');
            const valor = selectElement.value;
            if (valor.includes("Outro") || valor.includes("Outra")) {
                blocoOutro.classList.remove('hidden');
            } else {
                blocoOutro.classList.add('hidden');
            }
        }

        window.voltarEscolha = function() {
            document.getElementById('tela-formulario').classList.add('hidden');
            document.getElementById('tela-escolha').classList.remove('hidden');
            limparFormulario();
        }

        // Função otimizada para processar MÚLTIPLAS fotos e compactá-las
        window.processarFotos = function(input) {
            const containerPreview = document.getElementById('preview-container');
            const statusFoto = document.getElementById('status-foto');
            containerPreview.innerHTML = "";
            fotosBase64Array = [];

            if (input.files && input.files.length > 0) {
                statusFoto.textContent = `Processando ${input.files.length} foto(s)...`;
                
                Array.from(input.files).forEach((file) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const img = new Image();
                        img.src = e.target.result;
                        img.onload = function() {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            
                            const maxDimension = 800;
                            if (width > height && width > maxDimension) {
                                height *= maxDimension / width;
                                width = maxDimension;
                            } else if (height > maxDimension) {
                                width *= maxDimension / height;
                                height = maxDimension;
                            }

                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            
                            const fotoComprimida = canvas.toDataURL('image/jpeg', 0.7);
                            fotosBase64Array.push(fotoComprimida);

                            // Adiciona a miniatura na tela
                            const thumb = document.createElement('img');
                            thumb.src = fotoComprimida;
                            thumb.className = 'preview-img';
                            containerPreview.appendChild(thumb);

                            statusFoto.textContent = `✔ ${fotosBase64Array.length} foto(s) carregada(s) e pronta(s)!`;
                        }
                    }
                    reader.readAsDataURL(file);
                });
            } else {
                statusFoto.textContent = "";
            }
        }

        window.enviarSolicitacao = async function() {
            const msgAviso = document.getElementById('msg-aviso');
            msgAviso.textContent = "";

            const blocos = document.querySelectorAll('.bloco-item-dinamico');
            let itensConsolidados = [];

            for (let bloco of blocos) {
                const select = bloco.querySelector('.select-item');
                let valorItem = select.value;

                if (valorItem.includes("Outro") || valorItem.includes("Outra")) {
                    const inputDigitado = bloco.querySelector('.input-outro-item').value.trim();
                    if (!inputDigitado) {
                        msgAviso.textContent = "Por favor, digite o nome de todos os itens especificados!";
                        return;
                    }
                    valorItem = inputDigitado;
                }
                itensConsolidados.push(valorItem);
            }

            if (itensConsolidados.length === 0) {
                msgAviso.textContent = "Adicione ao menos um item à solicitação.";
                return;
            }

            const observacao = document.getElementById('obs-item').value.trim();
            const agora = new Date();

            const novoPedido = {
                usuarioEmail: usuarioLogado.email,
                nomeTecnico: usuarioLogado.nome,
                tipo: categoriaAtual,
                item: itensConsolidados.join(', '),
                observacao: observacao,
                fotos: fotosBase64Array, // Salvando o array completo de imagens
                statusPedido: "PENDENTE",
                dataEnvio: agora.toLocaleDateString() + ' ' + agora.toLocaleTimeString(),
                timestamp: agora.getTime(),
                dataConclusao: null
            };

            try {
                await addDoc(collection(db, "solicitacoes_epis"), novoPedido);
                alert("Solicitação enviada com sucesso ao gestor!");
                voltarEscolha();
                carregarMeusPedidos();
            } catch (e) {
                console.error("Erro ao enviar:", e);
                msgAviso.textContent = "Erro ao enviar pedido (tente enviar menos fotos ou fotos mais leves).";
            }
        }

        function limparFormulario() {
            document.getElementById('obs-item').value = "";
            document.getElementById('foto-item').value = "";
            document.getElementById('preview-container').innerHTML = "";
            document.getElementById('status-foto').textContent = "";
            document.getElementById('container-itens').innerHTML = "";
            fotosBase64Array = [];
        }

        async function carregarMeusPedidos() {
            const containerPedidos = document.getElementById('meus-pedidos');
            containerPedidos.innerHTML = "Carregando...";

            try {
                const q = query(collection(db, "solicitacoes_epis"), where("usuarioEmail", "==", usuarioLogado.email));
                const querySnapshot = await getDocs(q);
                
                let meusPedidos = [];
                querySnapshot.forEach((docSnap) => {
                    meusPedidos.push({ id: docSnap.id, ...docSnap.data() });
                });

                meusPedidos.sort((a, b) => b.timestamp - a.timestamp);

                if (meusPedidos.length === 0) {
                    containerPedidos.innerHTML = "<p>Você ainda não fez nenhuma solicitação.</p>";
                    return;
                }

                containerPedidos.innerHTML = "";
                meusPedidos.forEach(p => {
                    let classeStatus = 'status-pendente';
                    if (p.statusPedido === 'APROVADO') classeStatus = 'status-aprovado';
                    if (p.statusPedido === 'REJEITADO') classeStatus = 'status-rejeitado';
                    if (p.statusPedido === 'ENTREGUE' || p.statusPedido === 'FECHADO') classeStatus = 'status-entregue';

                    // Tratativa para exibir múltiplas fotos (ou compatibilidade com pedidos antigos que tinham só 'p.foto')
                    let imgsHtml = "";
                    if (p.fotos && Array.isArray(p.fotos) && p.fotos.length > 0) {
                        imgsHtml = `<div class="preview-container" style="margin-top:6px;">`;
                        p.fotos.forEach(imgUrl => {
                            imgsHtml += `<img src="${imgUrl}" class="preview-img">`;
                        });
                        imgsHtml += `</div>`;
                    } else if (p.foto) {
                        imgsHtml = `<br><img src="${p.foto}" class="preview-img" style="margin-top:6px;">`;
                    }

                    containerPedidos.innerHTML += `
                        <div class="lista-pedido">
                            <b>Categoria:</b> ${p.tipo} | <b>Item(ns):</b> ${p.item} <br>
                            <b>Observação:</b> ${p.observacao || 'Nenhuma'} <br>
                            <b>Status:</b> <span class="${classeStatus}">${p.statusPedido}</span> <br>
                            <b>Aberto em:</b> ${p.dataEnvio} <br>
                            ${p.dataConclusao ? `<b>Concluído/Recebido em:</b> ${p.dataConclusao} <br>` : ''}
                            ${imgsHtml}
                        </div>
                    `;
                });

            } catch (e) {
                console.error("Erro ao carregar pedidos:", e);
                containerPedidos.innerHTML = "<p>Erro ao carregar seus pedidos.</p>";
            }
        }

        carregarMeusPedidos();
    </script>
</body>
</html>
